spring.application.name=ApiEventos
# clase del CRUD (7 oct): el profesor prueba en el 8080 (localhost:8080/api/v1/eventos)
server.port=8080

# --- MySQL nativo en el 3306 (con docker compose, arrancar con DB_PORT=3307) ---
# 29sept: la base se llama GestionEventos7CM2, como en la clase del primer día
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/GestionEventos7CM2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# zip: sin conversión a snake_case, la tabla se llama Evento y las columnas llevan los nombres de @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# --- Swagger / OpenAPI ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/documentacion/swagger-ui.html
# clase del CRUD (7 oct), parte 2: el profesor dicta paths-to-match=/api/v1/eventos/**
springdoc.paths-to-match=/api/v1/eventos/**

# --- Correo (Gmail). Usuario, contraseña de aplicación y destinatario salen del entorno, nunca del código ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
app.correo.destinatario=${MAIL_TO:}
