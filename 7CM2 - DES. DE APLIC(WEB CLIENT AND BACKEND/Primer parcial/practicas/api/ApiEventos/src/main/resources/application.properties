# Configuración de la aplicación. Spring Boot lee este archivo al arrancar. Las expresiones ${NOMBRE:valor}
# significan "usa la variable de entorno NOMBRE, y si no existe usa valor".

spring.application.name=ApiEventos
# Puerto donde escucha la API. clase del CRUD (7 oct): el profesor prueba en el 8080, o sea
# http://localhost:8080/api/v1/eventos
server.port=8080

# --- Base de datos: MySQL nativo en el 3306 (con docker compose, arrancar con DB_PORT=3307) ---
# 29sept: la base se llama GestionEventos7CM2, como en la clase del primer día. La URL se lee así:
# servidor localhost, puerto 3306, base GestionEventos7CM2. Los parámetros del final evitan problemas
# de conexión: useSSL=false desactiva SSL en local, allowPublicKeyRetrieval=true deja que MySQL 8 entregue
# su llave pública para autenticarse, y serverTimezone=UTC fija la zona horaria para las fechas.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/GestionEventos7CM2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# tarea de clase (8 oct): usuario, contraseña y URL de la base deberían venir de variables de entorno, no
# escritos aquí. Por ahora solo la contraseña sale del entorno (DB_PASSWORD, y si no existe usa "admin");
# el usuario y la URL siguen escritos.
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:admin}

# ddl-auto=update: Hibernate crea la tabla Evento si no existe y le agrega las columnas que falten, sin
# borrar datos. show-sql=true imprime en consola cada consulta SQL que ejecuta (útil para aprender).
# open-in-view=false evita que Hibernate mantenga la conexión abierta durante toda la petición HTTP.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# zip: por defecto Spring Boot convierte los nombres Java a snake_case (nombreEvento pasaría a nombre_evento).
# Estas dos líneas desactivan esa conversión: la tabla se llama Evento y cada columna lleva exactamente el
# nombre que se puso en @Column (idEvento, nombreEvento...).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# --- Swagger / OpenAPI: documentación de la API generada a partir del controlador ---
# clase del CRUD, parte 2 (7 oct): se hace de forma declarativa (con propiedades, sin código). El profesor
# dice que también puede hacerse programática, con una clase de configuración que ponga nombre, etiquetas
# y descripción a cada método. Con estas propiedades queda así:
#  - api-docs.enabled: genera la especificación OpenAPI 3, disponible en /v3/api-docs.
#  - swagger-ui.enabled y swagger-ui.path: la página interactiva para probar los endpoints, en
#    http://localhost:8080/documentacion/swagger-ui.html
#  - paths-to-match: solo documenta las rutas que empiezan con /api/v1/eventos; es la misma ruta base del
#    controlador. Si no coincidiera, Swagger saldría vacío.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/documentacion/swagger-ui.html
springdoc.paths-to-match=/api/v1/eventos/**

# --- Correo (Gmail) ---
# clase del correo (8 oct): se configura el servidor de correo (SMTP, el protocolo para enviar correos).
#  - host y port: el servidor de Gmail y su puerto 587.
#  - mail.smtp.auth=true: el servidor pide usuario y contraseña.
#  - mail.smtp.starttls.enable=true: la conexión se cifra con STARTTLS.
#  - username y password: la cuenta de Gmail y su contraseña de aplicación (la cuenta debe permitir
#    aplicaciones de terceros; Google quitó ese soporte por defecto en 2020).
# Usuario, contraseña de aplicación y destinatario salen del entorno (MAIL_USER, MAIL_PASSWORD, MAIL_TO) y nunca
# del código, como pidió el profesor de tarea. En clase los escribió directo para la demostración.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
# Propiedad propia (no es de Spring): a quién se le envía el aviso del evento. La lee EmailServiceImpl.
app.correo.destinatario=${MAIL_TO:}
